services:
  # ─── 1. Backend Web Service ───────────────────────────────────────────────
  - type: web
    name: lost-and-found-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_NAME
        value: campus_lf
      - key: JWT_SECRET
        value: supersecretkey_campus_lf_jwt_token_2026
      - key: JWT_ACCESS_EXPIRATION_TTL
        value: "86400"
      - key: ADMIN_EMAIL
        value: admin@campus.com
      - key: ADMIN_PASSWORD
        value: Admin@1234
      - key: ADMIN_FIRSTNAME
        value: Campus
      - key: ADMIN_LASTNAME
        value: Admin
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # ─── 2. Frontend Static Site ──────────────────────────────────────────────
  - type: web
    name: lost-and-found-frontend
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lost-and-found-backend
          property: host
